<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Complaint Letter Writer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #e9edf2;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #1e2530;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .stamp {
    display: inline-block;
    border: 2px solid #c0392b;
    color: #c0392b;
    font-weight: 800;
    font-size: 0.7rem;
    letter-spacing: 2px;
    padding: 4px 10px;
    border-radius: 3px;
    transform: rotate(-3deg);
    margin-bottom: 10px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 4px; color: #1e2530; }
  .rule { border: none; border-top: 2px solid #1e2530; margin: 16px 0 22px; }
  .subtitle { color: #5a6472; font-size: 0.9rem; margin-bottom: 24px; }
  .sheet {
    background: #fff;
    border: 1px solid #d3d9e0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    padding: 34px 32px;
  }
  .field-label { font-size: 0.75rem; color: #5a6472; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 700; }
  input[type=text] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 4px;
    border: 1px solid #c0c8d2;
    background: #fbfbfc;
    color: #1e2530;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 18px;
  }
  input[type=text]:focus { outline: none; border-color: #c0392b; }
  button.action {
    padding: 11px 26px;
    border: none;
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    background: #c0392b;
    color: #fff;
  }
  button.action:hover:not(:disabled) { background: #9c2d21; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #8a929c; min-height: 1.2em; }
  .result-body {
    font-size: 0.98rem;
    line-height: 1.75;
    margin: 24px 0 4px;
    padding: 18px 20px;
    background: #f7f8fa;
    border-left: 3px solid #c0392b;
    color: #1e2530;
  }
  .footer-note { color: #8a929c; font-size: 0.78rem; text-align: center; margin-top: 22px; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #d3d9e0;
    border-top-color: #c0392b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <span class="stamp">FORMAL COMPLAINT</span>
    <h1>QVAC Complaint Letter Writer</h1>
    <p class="subtitle">Describe the situation, get a firm but polite opening drafted on-device.</p>
    <hr class="rule" />

    <div class="sheet">
      <div class="field-label">Situation</div>
      <input type="text" id="mainInput" placeholder="e.g. package arrived damaged, no response after 2 emails" />
      <button class="action" id="generateBtn">Draft the Letter</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Drafting...';

      try {
        const res = await fetch('/api/complaint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ situation: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="result-body">${escapeHtml(data.letter)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
